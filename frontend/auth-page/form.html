<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — DataLake Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
    <style nonce="{{.Nonce}}">
        *,*::before,*::after{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:#F6F4FE;font-family:Manrope,system-ui,sans-serif;color:#1D1736}
        a{color:#5B3FD6}a:hover{color:#4528B8}
        .card{width:100%;max-width:480px;background:#FFFFFF;border:1px solid #E6E1FA;border-radius:20px;box-shadow:0 24px 60px rgba(61,38,160,.12);padding:40px;display:flex;flex-direction:column;gap:20px}
        .head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
        .badge{width:48px;height:48px;border-radius:14px;background:#5B3FD6;display:flex;align-items:center;justify-content:center}
        h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
        .sub{margin:0;font-size:13px;line-height:1.5;color:#625C7A}
        form{display:flex;flex-direction:column;gap:20px}
        .field{display:flex;flex-direction:column;gap:6px}
        label{font-size:13px;font-weight:600}
        input[type=text],input[type=password]{height:46px;width:100%;border:1px solid #D9D3F2;border-radius:10px;padding:0 14px;font:inherit;font-size:15px;color:#1D1736;background:#FFFFFF}
        input:focus{outline:2px solid #5B3FD6;outline-offset:1px;border-color:#5B3FD6}
        .pw{position:relative}
        .pw input{padding-right:48px}
        .pw button{position:absolute;right:1px;top:1px;width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px}
        .submit{min-height:48px;border:0;border-radius:10px;background:#5B3FD6;color:#FFFFFF;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
        .submit:hover{background:#4528B8}
        .submit:disabled{background:#9C8BE6;cursor:default}
        .foot{display:flex;justify-content:center;font-size:12px;color:#625C7A}
        @media (max-width:480px){.card{padding:28px 20px}}

        /* ---------- Уведомления ---------- */
        .toasts{position:fixed;bottom:20px;right:20px;left:20px;z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none;font-family:Manrope,system-ui,sans-serif}
        /* Цвета задаются переменными: красный по умолчанию (ошибка), зелёный для .success */
        .toast{
            --c:#DC2626;       /* насыщенный: круг иконки, полоска таймера */
            --bg:#FEEDED;      /* светлая заливка */
            --bd:#F7B4B4;      /* рамка */
            --title:#8F1D1D;   /* заголовок и крестик */
            --text:#7A1F1F;    /* текст */
            --hover:#FBCFCF;   /* фон крестика при наведении */
            --shadow:rgba(185,28,28,.14);
            --t:8s;            /* время до автоскрытия */
            pointer-events:auto;position:relative;overflow:hidden;width:100%;max-width:400px;
            display:flex;align-items:flex-start;gap:14px;padding:16px 8px 18px 16px;
            background:var(--bg);border:1px solid var(--bd);border-radius:16px;
            box-shadow:0 1px 2px var(--shadow),0 16px 40px var(--shadow);
            animation:toast-in .35s cubic-bezier(.2,.9,.3,1.2);
            transition:opacity .2s,transform .2s;
        }
        .toast.success{
            --c:#079455; --bg:#ECFDF3; --bd:#75E0A7; --title:#085D3A; --text:#074D31;
            --hover:#D1FADF; --shadow:rgba(6,118,71,.16); --t:5s;
        }
        .toast.hide{opacity:0;transform:translateY(12px) scale(.98)}
        .toast-icon{flex:none;width:38px;height:38px;border-radius:50%;background:var(--c);color:#FFFFFF;display:flex;align-items:center;justify-content:center}
        .toast-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:1px}
        .toast-title{font:600 14px/1.4 Manrope,system-ui,sans-serif;color:var(--title)}
        .toast-text{font:400 13px/1.5 Manrope,system-ui,sans-serif;color:var(--text);overflow-wrap:anywhere}
        .toast-close{flex:none;width:36px;height:36px;margin-top:-6px;border:0;border-radius:10px;background:transparent;color:var(--title);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
        .toast-close:hover{background:var(--hover)}
        .toast-close:focus-visible{outline:2px solid #5B3FD6;outline-offset:1px}
        .toast-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c);transform-origin:left;animation:toast-timer var(--t) linear forwards}
        .toast:hover .toast-progress,.toast:focus-within .toast-progress{animation-play-state:paused}
        @keyframes toast-in{from{opacity:0;transform:translateY(16px) scale(.97)}}
        @keyframes toast-timer{to{transform:scaleX(0)}}
        .toast .icon-success,.toast.success .icon-error{display:none}
        .toast.success .icon-success{display:block}
        @media (prefers-reduced-motion:reduce){.toast{animation:none;transition:none}}
    </style>
</head>
<body>
<main class="card">
    <div class="head">
        <div class="badge">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
        </div>
        <h1>Вход в учётную запись</h1>
        <p class="sub">Приложение запрашивает доступ к вашему <br>корпоративному профилю</p>
    </div>

    <form id="login-form" data-login-request-id="{{.LoginRequestID}}">
        <div class="field">
            <label for="username">Логин</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Введите логин" required autofocus>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <div class="pw">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" required>
                <button id="pw-toggle" type="button" aria-label="Показать пароль">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#625C7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <button class="submit" type="submit">Войти</button>
    </form>

    <div class="foot">Защищено OAuth 2.0 и TLS</div>
</main>

<!-- Сюда скрипт добавляет уведомления. data-notices — те, что сервер просит показать сразу. -->
<div class="toasts" id="toasts" data-notices="{{.NoticesJSON}}"></div>

<!-- Заготовка одного уведомления: скрипт клонирует её и подставляет вид, заголовок и текст. -->
<template id="toast-tpl">
    <div class="toast">
        <span class="toast-icon">
            <svg class="icon-success" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            <svg class="icon-error" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v6"></path><path d="M12 17h.01"></path></svg>
        </span>
        <div class="toast-body">
            <span class="toast-title"></span>
            <span class="toast-text"></span>
        </div>
        <button class="toast-close" type="button" aria-label="Закрыть уведомление">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
        </button>
        <span class="toast-progress" aria-hidden="true"></span>
    </div>
</template>

<script nonce="{{.Nonce}}">
    (function () {
        var form = document.getElementById('login-form');
        var submitBtn = form.querySelector('.submit');
        var loginInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var toasts = document.getElementById('toasts');
        var toastTpl = document.getElementById('toast-tpl');

        var ERROR_TITLE = 'Ошибка авторизации';
        var REDIRECT_DELAY = 1500;

        // ---------- Уведомления ----------

        // Закрывается по крестику или когда полоска таймера дошла до конца.
        // При наведении таймер на паузе (см. CSS).
        function showToast(kind, title, text) {
            var toast = toastTpl.content.firstElementChild.cloneNode(true);
            toast.classList.add(kind);
            toast.setAttribute('role', kind === 'error' ? 'alert' : 'status');
            toast.querySelector('.toast-title').textContent = title;
            toast.querySelector('.toast-text').textContent = text;

            function close() {
                if (toast.classList.contains('hide')) return;
                toast.classList.add('hide');
                setTimeout(function () { toast.remove(); }, 200);
            }
            toast.querySelector('.toast-close').addEventListener('click', close);
            toast.querySelector('.toast-progress').addEventListener('animationend', close);

            toasts.appendChild(toast);
        }

        // Тексты из ответа {"bcode":..., "description":..., "errors":[...]}
        function errorMessages(data) {
            if (data && Array.isArray(data.errors) && data.errors.length) return data.errors;
            if (data && data.description) return [data.description];
            return ['Не удалось выполнить вход'];
        }

        try {
            JSON.parse(toasts.dataset.notices || '[]').forEach(function (n) {
                showToast(n.kind, n.title, n.text);
            });
        } catch (e) { /* битый JSON — просто не показываем */ }

        // ---------- Показ пароля ----------

        document.getElementById('pw-toggle').addEventListener('click', function () {
            var show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            this.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
        });

        // ---------- Вход: POST /users/login ----------

        var busy = false;

        function setBusy(value) {
            busy = value;
            submitBtn.disabled = value;
            submitBtn.setAttribute('aria-busy', value ? 'true' : 'false');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (busy) return;
            setBusy(true);

            var body = {
                credentials: {
                    login: loginInput.value.trim(),
                    password: passwordInput.value
                },
                loginRequestId: form.dataset.loginRequestId
            };

            try {
                var res = await fetch('/users/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                var data = await res.json().catch(function () { return null; });

                if (!res.ok) {
                    errorMessages(data).forEach(function (m) { showToast('error', ERROR_TITLE, m); });
                    passwordInput.value = '';
                    passwordInput.focus();
                    setBusy(false);
                    return;
                }

                showToast('success', 'Вход выполнен', 'Вы успешно авторизовались');

                // Куда идти дальше, сообщает сервер в поле redirectTo.
                if (data && data.redirectTo) {
                    setTimeout(function () { window.location.assign(data.redirectTo); }, REDIRECT_DELAY);
                }
            } catch (err) {
                showToast('error', ERROR_TITLE, 'Не удалось связаться с сервером. Проверьте подключение и попробуйте ещё раз.');
                setBusy(false);
            }
        });
    })();
</script>
</body>
</html>
