# Запуск: docker compose up -d
# Собрать данные и поднять: bash run.sh

name: dl_integration_service

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: integration_service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    # - "443:443"  # добавим после настройки HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
